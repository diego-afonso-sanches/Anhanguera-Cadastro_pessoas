<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Cadastro de pessoas</title>
</head>
<body>
    <div class="container mt-5">
        <h2>Cadastro de pessoas</h2>
        <form id="cadastroForm">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Digite o nome" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Digite o email" required maxlength="255">
            </div>
            <div class="mb-3">
                <label for="dtNascimento" class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="dtNascimento" placeholder="Digite a data de nascimento" required>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
        <div class="mt-5">
            <h3>Lista de pessoas cadastradas</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Email</th>
                        <th scope="col">Data de nascimento</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="pessoasTableBody">
                    <!-- As pessoas cadastradas serão adicionadas aqui -->
                </tbody>
            </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
